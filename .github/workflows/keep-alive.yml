name: Keep Render Alive

on:
  schedule:
    # Chạy 10 phút một lần
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công nếu muốn

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: curl -s https://studygap-ai.onrender.com/health > /dev/null
